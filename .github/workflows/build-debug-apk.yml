name: Build Document Scanner Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: document-scanner-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      APP_ID: com.akylas.documentscanner
      APP_BUILD_PATH: build/documentscanner
      APP_RESOURCES: App_Resources/documentscanner
      PROJECT_NAME: nsdocumentscanner
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      NS_SENTRY: ''
      PLAY_STORE_BUILD: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed

      # GitHub source ZIPs do not contain Git submodule contents.
      # The original OSS-DocumentScanner repository currently pins:
      #   tools     -> Akylas/app-tools @ 01fb954
      #   zxingcpp  -> Akylas/zxing-cpp @ cbf6afd
      #
      # Restore those exact revisions so "file:tools" and native ZXing
      # dependencies exist before Yarn starts.
      - name: Restore required source submodules
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf tools zxingcpp

          git clone --filter=blob:none https://github.com/Akylas/app-tools.git tools
          git -C tools checkout 01fb954
          git -C tools submodule update --init --recursive

          git clone --filter=blob:none https://github.com/Akylas/zxing-cpp.git zxingcpp
          git -C zxingcpp checkout cbf6afd
          git -C zxingcpp submodule update --init --recursive

          test -f tools/package.json
          test -f zxingcpp/CMakeLists.txt

          echo "Restored tools revision:"
          git -C tools rev-parse --short HEAD

          echo "Restored zxingcpp revision:"
          git -C zxingcpp rev-parse --short HEAD

      - name: Enable Corepack and Yarn
        shell: bash
        run: |
          corepack enable
          yarn --version

      - name: Install NativeScript CLI
        shell: bash
        run: |
          python3 -m pip install --upgrade pip six
          npm install -g @akylas/nativescript-cli --ignore-scripts --legacy-peer-deps
          ns package-manager set yarn2
          ns usage-reporting disable
          ns error-reporting disable
          ns --version

      - name: Install project dependencies
        shell: bash
        run: |
          yarn install --silent

      - name: Download OpenCV and Tesseract build resources
        shell: bash
        run: |
          chmod +x scripts/ci.prepare.sh
          ./scripts/ci.prepare.sh --platform android --flavor documentscanner

      - name: Verify native resources
        shell: bash
        run: |
          test -d opencv/android || {
            echo "ERROR: opencv/android is missing"
            exit 1
          }

          test -d tesseract/android || {
            echo "ERROR: tesseract/android is missing"
            exit 1
          }

          test -d tools || {
            echo "ERROR: tools is missing"
            exit 1
          }

          test -d zxingcpp || {
            echo "ERROR: zxingcpp is missing"
            exit 1
          }

          echo "Required native resources are ready."

      - name: Build Document Scanner Debug APK
        shell: bash
        run: |
          ns build android \
            --no-hmr \
            --env.devlog \
            --env.production=0 \
            --gradleArgs=-PabiFilters=arm64-v8a,armeabi-v7a

      - name: Find and collect Debug APK
        id: apk
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK_PATH="$(find "${APP_BUILD_PATH}" -type f -name '*.apk' \
            ! -name '*release*' \
            ! -name '*unsigned*' \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not found."
            echo "All APK files:"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK_PATH" dist/OSS-DocumentScanner-debug.apk

          echo "apk_path=dist/OSS-DocumentScanner-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          ls -lh dist/OSS-DocumentScanner-debug.apk

      - name: Upload Debug APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSS-DocumentScanner-debug
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Replace debug-latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete debug-latest --cleanup-tag --yes 2>/dev/null || true

          gh release create debug-latest \
            "${{ steps.apk.outputs.apk_path }}#OSS-DocumentScanner-debug.apk" \
            --target "${{ github.sha }}" \
            --title "OSS Document Scanner - Latest Debug APK" \
            --notes "Automatic debug build from commit ${{ github.sha }}. Debug APK only; no release APK or AAB is generated." \
            --prerelease
