name: Build Document Scanner Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: document-scanner-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      APP_ID: com.akylas.documentscanner
      APP_BUILD_PATH: build/documentscanner
      APP_RESOURCES: App_Resources/documentscanner
      PROJECT_NAME: nsdocumentscanner
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      NS_SENTRY: ''
      PLAY_STORE_BUILD: ''
      OPENCV_VERSION: '4.12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "cmdline-tools;latest" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Enable Corepack and Yarn
        shell: bash
        run: |
          corepack enable
          yarn --version

      - name: Install NativeScript CLI
        shell: bash
        run: |
          python3 -m pip install --upgrade pip six
          npm install -g @akylas/nativescript-cli --ignore-scripts --legacy-peer-deps
          ns package-manager set yarn2
          ns usage-reporting disable
          ns error-reporting disable
          ns --version

      - name: Install project dependencies
        shell: bash
        run: |
          yarn install --silent

      - name: Download project Android native resources
        shell: bash
        run: |
          set -euxo pipefail
          rm -f android.zip
          chmod +x scripts/ci.prepare.sh
          bash scripts/ci.prepare.sh --platform android --flavor documentscanner

      - name: Install OpenCV 4.12.0 Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          WORK_DIR="$RUNNER_TEMP/opencv-sdk"
          ZIP_PATH="$RUNNER_TEMP/opencv-${OPENCV_VERSION}-android-sdk.zip"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          wget \
            --tries=5 \
            --retry-connrefused \
            --waitretry=2 \
            -O "$ZIP_PATH" \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip"

          unzip -q "$ZIP_PATH" -d "$WORK_DIR"

          SDK_ROOT="$(find "$WORK_DIR" -maxdepth 2 -type d -name 'OpenCV-android-sdk' | head -n 1)"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: OpenCV-android-sdk directory was not found after extraction."
            find "$WORK_DIR" -maxdepth 3 -type d -print
            exit 1
          fi

          rm -rf opencv/android
          mkdir -p opencv/android/include

          cp -a "$SDK_ROOT/sdk/native/jni/include/." opencv/android/include/
          cp -a "$SDK_ROOT/sdk/native/staticlibs" opencv/android/staticlibs
          cp -a "$SDK_ROOT/sdk/native/3rdparty" opencv/android/3rdparty

      - name: Materialize native plugin dependencies
        shell: bash
        run: |
          set -euxo pipefail

          CPP_DIR="plugin-nativeprocessor/platforms/android/cpp"

          rm -rf \
            "$CPP_DIR/opencv" \
            "$CPP_DIR/tesseract" \
            "$CPP_DIR/src" \
            "$CPP_DIR/zxingcpp"

          mkdir -p "$CPP_DIR/opencv" "$CPP_DIR/tesseract" "$CPP_DIR/src" "$CPP_DIR/zxingcpp"

          cp -a opencv/android/. "$CPP_DIR/opencv/"
          cp -a tesseract/android/. "$CPP_DIR/tesseract/"
          cp -a cpp/src/. "$CPP_DIR/src/"
          cp -a zxingcpp/. "$CPP_DIR/zxingcpp/"

      - name: Build Document Scanner Debug APK
        shell: bash
        run: |
          set -euxo pipefail
          ns build android \
            --no-hmr \
            --env.devlog \
            --env.production=0 \
            --gradleArgs=-PabiFilters=arm64-v8a,armeabi-v7a
