name: Build Document Scanner Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: document-scanner-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      APP_ID: com.akylas.documentscanner
      APP_BUILD_PATH: build/documentscanner
      APP_RESOURCES: App_Resources/documentscanner
      PROJECT_NAME: nsdocumentscanner
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      NS_SENTRY: ''
      PLAY_STORE_BUILD: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Enable Corepack and Yarn
        run: |
          corepack enable
          yarn --version

      - name: Install NativeScript CLI
        run: |
          python3 -m pip install --upgrade pip six
          npm install -g @akylas/nativescript-cli --ignore-scripts --legacy-peer-deps
          ns package-manager set yarn2
          ns usage-reporting disable
          ns error-reporting disable
          ns --version

      - name: Install project dependencies
        run: yarn install --silent

      - name: Download OpenCV and Tesseract build resources
        run: |
          chmod +x scripts/ci.prepare.sh
          ./scripts/ci.prepare.sh --platform android --flavor documentscanner

      - name: Verify native resources
        run: |
          test -d opencv/android || (echo "opencv/android is missing" && exit 1)
          test -d tesseract/android || (echo "tesseract/android is missing" && exit 1)
          echo "OpenCV and Tesseract resources are ready."

      - name: Build Document Scanner Debug APK
        run: |
          ns build android \
            --no-hmr \
            --env.devlog \
            --env.production=0 \
            --gradleArgs=-PabiFilters=arm64-v8a,armeabi-v7a

      - name: Collect generated Debug APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find build/documentscanner -type f -path '*/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Debug APK was not found. Available APK files:"
            find build/documentscanner -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK_PATH" dist/OSS-DocumentScanner-debug.apk
          echo "apk_path=dist/OSS-DocumentScanner-debug.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/OSS-DocumentScanner-debug.apk

      - name: Upload Debug APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSS-DocumentScanner-debug
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Replace debug-latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete debug-latest --cleanup-tag --yes 2>/dev/null || true

          gh release create debug-latest \
            "${{ steps.apk.outputs.apk_path }}#OSS-DocumentScanner-debug.apk" \
            --target "${{ github.sha }}" \
            --title "OSS Document Scanner - Latest Debug APK" \
            --notes "Automatic debug build from commit ${{ github.sha }}. This is a debug APK only; no release APK is generated by this workflow." \
            --prerelease
